# Test-only configuration. Activated by the surefire setting in pom.xml, so it layers on top of
# src/main/resources/application.properties instead of replacing it.
#
# Why this file exists: with nothing here, the suite inherited the main configuration and
# connected to the development database. A full `mvn test` run left behind 631 users, 188
# organizations and 110 projects, every one of them a row no human had entered. Every project
# create, file classification and review-flow test wrote into the data being demonstrated by hand.
#
# The URL is resolved from TEST_DB_URL and not from DB_URL, which looks like an omission and is
# not. The main configuration imports the project root .env through spring.config.import, and
# that .env names the development database in DB_URL, so reading DB_URL here would hand the
# suite the developer's own data no matter what this file says. Environment variables cannot be
# told apart from imported ones, so the test database is named by a variable of its own. CI sets
# TEST_DB_URL to the same throwaway database it already uses.
#
# Credentials are not repeated here: the main configuration reads them from DB_USERNAME and
# DB_PASSWORD, which .env supplies locally and CI sets as environment variables.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5433/central_archive_test}

# The bootstrap admin is not needed to exercise the application, and creating it on every test
# run only adds a row nobody asked for. CI already disables it.
app.bootstrap.admin.enabled=false