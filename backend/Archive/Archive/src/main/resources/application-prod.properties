# Production profile
# Activate with: SPRING_PROFILES_ACTIVE=prod
# Required secrets/connection values intentionally have no development fallback.

server.port=${SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=core

# MinIO
minio.endpoint=${MINIO_ENDPOINT}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET:archive-files}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Bootstrap administrator is disabled by default in production.
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@central-archive.local}

# Browser/API exposure
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

# Offline package contract
archive.instance.uuid=${ARCHIVE_INSTANCE_UUID}
archive.packages.supported-schema-versions=${PACKAGE_SUPPORTED_SCHEMA_VERSIONS:1.0}
spring.servlet.multipart.max-file-size=${MAX_PACKAGE_UPLOAD_SIZE:20GB}
spring.servlet.multipart.max-request-size=${MAX_PACKAGE_REQUEST_SIZE:20GB}

# Legacy migration must never start implicitly in production.
legacy.migration.enabled=false

# Operational endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
