spring.application.name=Archive

# Load the repository-local runtime file when the app is launched from this
# module. Environment variables still take precedence over these values.
spring.config.import=optional:file:../../../.env[.properties],optional:file:.env[.properties]

# All values can be overridden with environment variables. The fallback values
# are for local development only; do not use them in a shared environment.
server.port=${SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/central_archive}
spring.datasource.username=${DB_USERNAME:archive_user}
spring.datasource.password=${DB_PASSWORD:archive_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=core

# Flyway owns schema evolution. Existing pre-Flyway databases are baselined at V1
# and receive compatibility migrations from V2 onward.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:archive-files}

# Legacy staging database (restored from the 600GB pg_dump backup)
# Production: pg_restore -h localhost -p 5433 -U postgres -d legacy_staging /path/to/dump.file
# TEST/DEV: point at the small real copy (ARC2) to validate before the big migration.
legacy.datasource.url=${LEGACY_DB_URL:jdbc:postgresql://localhost:5433/ARC2}
legacy.datasource.username=${LEGACY_DB_USERNAME:archive_user}
legacy.datasource.password=${LEGACY_DB_PASSWORD:archive_password}
legacy.datasource.driver-class-name=org.postgresql.Driver

# Legacy migration tuning
legacy.migration.enabled=false
legacy.migration.default-year=2000
legacy.migration.batch-size=200
legacy.migration.source-name=ARC2
legacy.migration.minio-prefix=legacy/migration

# JWT
jwt.secret=${JWT_SECRET:bG9jYWwtZGV2ZWxvcG1lbnQtand0LXNlY3JldC0zMi1ieXRlISE=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Development bootstrap account. Provide a strong value through
# BOOTSTRAP_ADMIN_PASSWORD before enabling this outside local development.
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@central-archive.local}

# SpringDoc
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Offline package import/export
archive.instance.uuid=${ARCHIVE_INSTANCE_UUID:00000000-0000-0000-0000-000000000001}
archive.packages.supported-schema-versions=${PACKAGE_SUPPORTED_SCHEMA_VERSIONS:1.0}
archive.packages.max-expanded-file-bytes=${PACKAGE_MAX_EXPANDED_FILE_BYTES:21474836480}
archive.packages.max-expanded-total-bytes=${PACKAGE_MAX_EXPANDED_TOTAL_BYTES:42949672960}
archive.packages.max-archive-entries=${PACKAGE_MAX_ARCHIVE_ENTRIES:100000}
spring.servlet.multipart.max-file-size=${MAX_PACKAGE_UPLOAD_SIZE:20GB}
spring.servlet.multipart.max-request-size=${MAX_PACKAGE_REQUEST_SIZE:20GB}
