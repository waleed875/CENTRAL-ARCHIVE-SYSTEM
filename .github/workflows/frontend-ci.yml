name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "docker-compose.yml"
  push:
    branches:
      - main
      - chore/replace-frontend-with-frontarchave
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "docker-compose.yml"

permissions:
  contents: read

jobs:
  typecheck-build-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Docker image build
        run: docker build --tag central-archive-frontend:ci .
      - name: Backend gateway smoke test
        run: node tests/gateway-smoke.mjs
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate Docker Compose configuration
        working-directory: .
        env:
          DOCKER_POSTGRES_PASSWORD: ci-postgres-password
          DOCKER_MINIO_PASSWORD: ci-minio-password
          DOCKER_JWT_SECRET: Y2ktand0LXNlY3JldC1ieXRlcy1mb3ItdmFsaWRhdGlvbg==
          DOCKER_SETTINGS_ENCRYPTION_KEY: Y2ktc2V0dGluZ3MtZW5jcnlwdGlvbi1rZXk=
          DOCKER_ARCHIVE_INSTANCE_UUID: 00000000-0000-4000-8000-000000000001
          DOCKER_ADMIN_PASSWORD: ci-admin-password
        run: docker compose -f docker-compose.yml config --quiet
