name: Backend CI

on:
  pull_request:
    paths:
      - "backend/Archive/Archive/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/Archive/Archive/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  compile-and-unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/Archive/Archive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/Archive/Archive/pom.xml

      - name: Compile backend
        run: bash mvnw -B -DskipTests package

      - name: Run focused unit tests
        run: bash mvnw -B -Dtest=PackageArchiveServiceTest,ConfidentialityAccessServiceTest,ExportServiceTest,JwtTokenProviderTest,ProjectServiceTest,FileServiceTest test
